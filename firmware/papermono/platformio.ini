; Target: M5Stack PaperMono SKU C153 (not PaperMono-Lite C153-Lite)
; https://docs.m5stack.com/en/core/PaperMono
; ESP32-S3R8, 16MB flash, 8MB octal PSRAM, SSD1677 480x800, FT6336G touch.
; Board flags follow M5Stack's PaperMono PlatformIO snippet.
; Beta: status + Stop / Dock / Pause / Lights. Full e-paper refresh every 10 partials.

[env:papermono]
platform = espressif32@6.12.0
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Unified@^0.2.7
  bblanchon/ArduinoJson@^7.3.0
